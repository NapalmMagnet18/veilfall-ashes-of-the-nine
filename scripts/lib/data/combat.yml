# the Bladewraith trainer in Candlehold (Ser Hollin Vey): two ranks per art, gated by level, paid in copper
trainer:
  reach: 3.5
  arts:
    crosswound: { name: "Crosswound", per: "+20% damage per rank", ranks: [{ lvl: 3, cost: 150 }, { lvl: 6, cost: 900 }] }
    griefstep: { name: "Griefstep", per: "-0.6s cooldown, +0.1s untouchable per rank", ranks: [{ lvl: 2, cost: 100 }, { lvl: 5, cost: 600 }] }
    guard: { name: "Afterimage Guard", per: "+0.3s window, +35% riposte per rank", ranks: [{ lvl: 4, cost: 300 }, { lvl: 7, cost: 1400 }] }
# wayshrines: touch one to attune (per Bearer, saved), then travel between attuned shrines for copper
wayshrines:
  reach: 3
  cost: 10
  list:
    - { id: shrine-wayside, name: "Wayside Fire", x: -7.5, z: 0.5, gate: none }
    - { id: shrine-candlehold, name: "Candlehold", x: 0, z: 58.5, gate: none }
    - { id: shrine-abbey, name: "The Ashen Abbey", x: 6, z: -170, gate: abbey }
# the Candlehold vault: Dame Maudry Quill keeps each Bearer's stash (saved with the Bearer)
vault:
  reach: 3.2
  slots: 18
  row: 9
  rows: [5000, 20000, 50000]   # copper for each extra row of nine, in order
  x: -8
  z: 70
# the guild vault: one shared chest per Spawn guild per realm, beside Maudry's counter
guildVault:
  reach: 2.6
  slots: 27
  x: -11
  z: 63.5
