# The Veil's painted shot (places/veil): the Lantern Shrine of the Nine framed in the centre third,
# sky above the crown emblem for the title, the ravine and the Dripping Gate's glow through the arch.
# The parked body stands at the origin, behind the eye. The camera reads eye + drift * sin(t * 0.07).
eye: { x: 0.4, y: 2.3, z: 2 }
aim: { x: 0, y: 3.6, z: -14 }
fov: 40
drift: { x: 0.7, y: 0.12, z: 0.25 }
