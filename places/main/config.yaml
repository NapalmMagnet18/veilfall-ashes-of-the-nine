atmosphere:
  clouds:
    altitude: 450
    density: 0.55
    enabled: true
    opacity: 0.85
    thickness: 500
    color: "#2c3038"
    speed: 1.5
  fog:
    far: 170
    kind: linear
    near: 30
    height: {base: 0.5, falloff: 5}
  look:
    script: scripts/look-default.js
  moon:
    intensity: 7
    enabled: true
    phase: 0.5
    size: 1.3
  sky:
    kind: realistic
    model: hosek
  stars:
    density: 0.5
    enabled: true
    milkyWay: 0.3
  timeOfDay: 20.6
  wind:
    direction: 200
    speed: 3
  hemisphere:
    groundColor: "#1c1712"
    intensity: 2.2
    skyColor: "#4a6290"
  wet: 0.55
  ambient:
    light: {color: "#2a3550", intensity: 0.6}
defaultSpawnPoint:
  x: 0
  y:
    terrain: 0
  z: 5
gravity:
  x: 0
  y: -24
  z: 0
mode: 3d
terrain:
  decorations:
    bindings:
      grass:
        - clover
        - grass
        - mushroom
        - ashfern
        - gravegrass
        - glowcap
        - bramble
        - mossoak
        - bellspire
        - starbloom
        - lanternlily
      gravel:
        - gravegrass
        - bramble
        - glowcap
        - mossoak
        - starbloom
        - bellspire
    layers:
      clover:
        density: 0.6
        items:
          - kind: scripted
            randomRotation: true
            scale:
              - 0.8
              - 1.4
            script: scripts/clover.js
            seed: 1
            useTerrainColor: true
            wind:
              force: 0.02
      grass:
        density: 9
        items:
          - kind: scripted
            randomRotation: true
            scale:
              - 0.9
              - 1.4
            script: scripts/grass.js
            seed: 1
            wind:
              force: 0.06
        material:
          kind: scripted
          script: scripts/grass-look.js
      ashfern:
        density: 0.35
        cluster: {clusters: 26, radius: 7, seed: 3, falloff: 0.6}
        noise: {scale: 22, threshold: 0.35, seed: 11}
        items:
          - {kind: scripted, script: scripts/plants/ashfern.js, seed: 1, randomRotation: true, scale: [0.8, 1.5], params: {tone: 0}, wind: {force: 0.05}, colorJitter: {hue: 6, value: 0.12}}
          - {kind: scripted, script: scripts/plants/ashfern.js, seed: 2, randomRotation: true, scale: [0.7, 1.3], params: {tone: 1}, wind: {force: 0.05}, colorJitter: {hue: 6, value: 0.12}}
      gravegrass:
        density: 1.2
        noise: {scale: 14, threshold: 0.3, seed: 5}
        items:
          - {kind: scripted, script: scripts/plants/gravegrass.js, seed: 1, randomRotation: true, scale: [0.8, 1.4], wind: {force: 0.09}, colorJitter: {value: 0.1}}
          - {kind: scripted, script: scripts/plants/gravegrass.js, seed: 4, randomRotation: true, scale: [0.6, 1.1], wind: {force: 0.09}, colorJitter: {value: 0.1}}
      bramble:
        density: 0.12
        cluster: {clusters: 18, radius: 5, seed: 7, falloff: 0.5}
        items:
          - {kind: scripted, script: scripts/plants/bramble.js, seed: 1, randomRotation: true, scale: [0.8, 1.5], wind: {force: 0.015}}
          - {kind: scripted, script: scripts/plants/bramble.js, seed: 3, randomRotation: true, scale: [0.7, 1.2], wind: {force: 0.015}}
      glowcap:
        density: 0.25
        cluster: {clusters: 30, radius: 2.5, seed: 9, falloff: 0.7}
        items:
          - {kind: scripted, script: scripts/plants/glowcap.js, seed: 1, randomRotation: true, scale: [0.9, 1.8]}
          - {kind: scripted, script: scripts/plants/glowcap.js, seed: 5, randomRotation: true, scale: [0.8, 1.4]}
      mossoak:
        density: 0.01
        cluster: {clusters: 32, radius: 14, seed: 13, falloff: 0.5}
        constraints: {slopeRange: [0, 0.25]}
        items:
          - {kind: scripted, script: scripts/plants/mossoak.js, seed: 1, randomRotation: true, scale: [0.9, 1.4], wind: {force: 0.004}}
          - {kind: scripted, script: scripts/plants/mossoak.js, seed: 2, randomRotation: true, scale: [0.8, 1.3], wind: {force: 0.004}}
          - {kind: scripted, script: scripts/plants/mossoak.js, seed: 3, randomRotation: true, scale: [1, 1.5], wind: {force: 0.004}}
      bellspire:
        density: 0.3
        cluster: {clusters: 40, radius: 6, seed: 21, falloff: 0.55}
        noise: {scale: 26, threshold: 0.3, seed: 23}
        items:
          - {kind: scripted, script: scripts/plants/veilbloom.js, seed: 1, randomRotation: true, scale: [0.8, 1.4], params: {kind: spire}, wind: {force: 0.06}, colorJitter: {hue: 14, value: 0.1}}
          - {kind: scripted, script: scripts/plants/veilbloom.js, seed: 2, randomRotation: true, scale: [0.7, 1.2], params: {kind: spire}, wind: {force: 0.06}, colorJitter: {hue: 14, value: 0.1}}
      starbloom:
        density: 0.7
        cluster: {clusters: 55, radius: 4.5, seed: 31, falloff: 0.6}
        items:
          - {kind: scripted, script: scripts/plants/veilbloom.js, seed: 3, randomRotation: true, scale: [0.9, 1.5], params: {kind: star}, wind: {force: 0.04}, colorJitter: {hue: 10, value: 0.12}}
          - {kind: scripted, script: scripts/plants/veilbloom.js, seed: 4, randomRotation: true, scale: [0.8, 1.3], params: {kind: star}, wind: {force: 0.04}, colorJitter: {hue: 10, value: 0.12}}
      lanternlily:
        density: 0.04
        cluster: {clusters: 24, radius: 5, seed: 41, falloff: 0.5}
        constraints: {slopeRange: [0, 0.3]}
        items:
          - {kind: scripted, script: scripts/plants/veilbloom.js, seed: 5, randomRotation: true, scale: [0.9, 1.3], params: {kind: lily}, wind: {force: 0.03}}
          - {kind: scripted, script: scripts/plants/veilbloom.js, seed: 6, randomRotation: true, scale: [0.8, 1.2], params: {kind: lily}, wind: {force: 0.03}}
      mushroom:
        density: 0.05
        items:
          - colorJitter:
              hue: 4
              value: 0.1
            kind: scripted
            params:
              cap: "#7a9a86"
              stem: "#e8f0ea"
            randomRotation: true
            scale:
              - 1
              - 1.8
            script: scripts/mushroom.js
            seed: 1
  generator: scripts/terrain.js
  kind: heightmap
  materials:
    - albedo: cdn/texture-terrain-dead-grass-and-dark-moss-patchy-ash.png
      id: grass
      pbr: true
      antiTiling: stochastic
      normalStrength: 1.3
      roughnessIntensity: 0.85
      macro: {scale: 40, hue: 0.04, value: 0.18}
      tint: oklch(0.86 0.03 110)
    - albedo: cdn/texture-terrain-ash-dirt-cinders-and-rubble-dark.png
      id: gravel
      pbr: true
      antiTiling: stochastic
      normalStrength: 1.5
      roughnessIntensity: 0.85
      macro: {scale: 30, hue: 0.03, value: 0.15}
      tint: oklch(0.92 0.01 60)
    - albedo: cdn/texture-terrain-basalt-cliff-rock-dark-wet.png
      id: rock
      pbr: true
      antiTiling: stochastic
      normalStrength: 1.8
      roughnessIntensity: 0.85
      macro: {scale: 25, hue: 0.02, value: 0.2}
      tint: oklch(0.80 0.01 260)
    - albedo: cdn/texture-terrain-wet-dark-flagstone-cobbles-old-pilgrim-road.png
      id: stone
      pbr: true
      antiTiling: stochastic
      normalStrength: 1.6
      roughnessIntensity: 0.85
      macro: {scale: 35, hue: 0.02, value: 0.14}
      tint: oklch(0.90 0.01 250)
      textureScale: 2.5
  seed: 1

arrivalBudget: { bytes: 740000 }

acoustics: { reverb: 0.22 }
