atmosphere:
  clouds:
    altitude: 500
    density: 0.7
    enabled: true
    opacity: 0.8
    thickness: 600
    color: "#5a5560"
    speed: 1
  fog:
    far: 220
    kind: linear
    near: 60
    height: {base: 1, falloff: 6}
  look:
    script: scripts/look-default.js
  moon:
    intensity: 3
    enabled: true
  sky:
    kind: realistic
    model: hosek
  stars:
    density: 0.6
    enabled: true
    milkyWay: 0.6
  timeOfDay: 17.45
  wind:
    direction: 200
    speed: 2
defaultSpawnPoint:
  x: 0
  y:
    terrain: 0
  z: 5
gravity:
  x: 0
  y: -24
  z: 0
mode: 3d
terrain:
  decorations:
    bindings:
      grass:
        - clover
        - grass
        - mushroom
    layers:
      clover:
        density: 0.6
        items:
          - kind: scripted
            randomRotation: true
            scale:
              - 0.8
              - 1.4
            script: scripts/clover.js
            seed: 1
            useTerrainColor: true
            wind:
              force: 0.02
      grass:
        density: 9
        items:
          - kind: scripted
            randomRotation: true
            scale:
              - 0.9
              - 1.4
            script: scripts/grass.js
            seed: 1
            wind:
              force: 0.06
        material:
          kind: scripted
          script: scripts/grass-look.js
      mushroom:
        density: 0.05
        items:
          - colorJitter:
              hue: 4
              value: 0.1
            kind: scripted
            params:
              cap: "#7a9a86"
              stem: "#e8f0ea"
            randomRotation: true
            scale:
              - 1
              - 1.8
            script: scripts/mushroom.js
            seed: 1
  generator: scripts/terrain.js
  kind: heightmap
  materials:
    - albedo: cdn/texture-terrain-dead-grass-and-dark-moss-patchy-ash.png
      id: grass
      pbr: true
      tint: oklch(0.86 0.03 110)
    - albedo: cdn/texture-terrain-ash-dirt-cinders-and-rubble-dark.png
      id: gravel
      pbr: true
      tint: oklch(0.92 0.01 60)
    - albedo: cdn/texture-terrain-basalt-cliff-rock-dark-wet.png
      id: rock
      pbr: true
      tint: oklch(0.80 0.01 260)
    - albedo: cdn/texture-terrain-wet-dark-flagstone-cobbles-old-pilgrim-road.png
      id: stone
      pbr: true
      tint: oklch(0.90 0.01 250)
      textureScale: 2.5
  seed: 1
