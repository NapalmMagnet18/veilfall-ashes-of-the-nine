atmosphere:
  clouds:
    altitude: 450
    density: 0.55
    enabled: true
    opacity: 0.85
    thickness: 500
    color: "#2c3038"
    speed: 1.5
  fog:
    far: 170
    kind: linear
    near: 30
    height: {base: 0.5, falloff: 5}
  look:
    script: scripts/look-default.js
  moon:
    intensity: 7
    enabled: true
    phase: 0.5
    size: 1.3
  sky:
    kind: realistic
    model: hosek
  stars:
    density: 0.5
    enabled: true
    milkyWay: 0.3
  timeOfDay: 20.6
  wind:
    direction: 200
    speed: 3
  hemisphere:
    groundColor: "#1c1712"
    intensity: 2.2
    skyColor: "#4a6290"
  wet: 0.55
  ambient:
    light: {color: "#2a3550", intensity: 0.6}
defaultSpawnPoint:
  x: 0
  y:
    terrain: 0
  z: 5
gravity:
  x: 0
  y: -24
  z: 0
mode: 3d
terrain:
  decorations:
    bindings:
      grass:
        - clover
        - grass
        - mushroom
    layers:
      clover:
        density: 0.6
        items:
          - kind: scripted
            randomRotation: true
            scale:
              - 0.8
              - 1.4
            script: scripts/clover.js
            seed: 1
            useTerrainColor: true
            wind:
              force: 0.02
      grass:
        density: 9
        items:
          - kind: scripted
            randomRotation: true
            scale:
              - 0.9
              - 1.4
            script: scripts/grass.js
            seed: 1
            wind:
              force: 0.06
        material:
          kind: scripted
          script: scripts/grass-look.js
      mushroom:
        density: 0.05
        items:
          - colorJitter:
              hue: 4
              value: 0.1
            kind: scripted
            params:
              cap: "#7a9a86"
              stem: "#e8f0ea"
            randomRotation: true
            scale:
              - 1
              - 1.8
            script: scripts/mushroom.js
            seed: 1
  generator: scripts/terrain.js
  kind: heightmap
  materials:
    - albedo: cdn/texture-terrain-dead-grass-and-dark-moss-patchy-ash.png
      id: grass
      pbr: true
      antiTiling: stochastic
      normalStrength: 1.3
      roughnessIntensity: 0.85
      macro: {scale: 40, hue: 0.04, value: 0.18}
      tint: oklch(0.86 0.03 110)
    - albedo: cdn/texture-terrain-ash-dirt-cinders-and-rubble-dark.png
      id: gravel
      pbr: true
      antiTiling: stochastic
      normalStrength: 1.5
      roughnessIntensity: 0.85
      macro: {scale: 30, hue: 0.03, value: 0.15}
      tint: oklch(0.92 0.01 60)
    - albedo: cdn/texture-terrain-basalt-cliff-rock-dark-wet.png
      id: rock
      pbr: true
      antiTiling: stochastic
      normalStrength: 1.8
      roughnessIntensity: 0.85
      macro: {scale: 25, hue: 0.02, value: 0.2}
      tint: oklch(0.80 0.01 260)
    - albedo: cdn/texture-terrain-wet-dark-flagstone-cobbles-old-pilgrim-road.png
      id: stone
      pbr: true
      antiTiling: stochastic
      normalStrength: 1.6
      roughnessIntensity: 0.85
      macro: {scale: 35, hue: 0.02, value: 0.14}
      tint: oklch(0.90 0.01 250)
      textureScale: 2.5
  seed: 1

arrivalBudget: { bytes: 520000 }
