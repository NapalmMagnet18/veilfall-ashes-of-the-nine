atmosphere:
  clouds:
    altitude: 600
    density: 0.5
    enabled: true
    opacity: 0.6
    thickness: 900
  fog:
    far: 500
    kind: linear
    near: 150
  look:
    script: scripts/look-default.js
  moon:
    intensity: 3
  sky:
    kind: realistic
    model: hosek
  stars:
    density: 0.6
    enabled: true
    milkyWay: 0.6
  timeOfDay: 7.4
  wind:
    direction: 230
    speed: 2
defaultSpawnPoint:
  x: 0
  y:
    terrain: 0
  z: 0
gravity:
  x: 0
  y: -24
  z: 0
mode: 3d
terrain:
  decorations:
    bindings:
      grass:
        - clover
        - grass
        - mushroom
    layers:
      clover:
        density: 5
        items:
          - kind: scripted
            randomRotation: true
            scale:
              - 0.8
              - 1.4
            script: scripts/clover.js
            seed: 1
            useTerrainColor: true
            wind:
              force: 0.02
      grass:
        density: 46
        items:
          - kind: scripted
            randomRotation: true
            scale:
              - 0.9
              - 1.4
            script: scripts/grass.js
            seed: 1
            wind:
              force: 0.06
        material:
          kind: scripted
          script: scripts/grass-look.js
      mushroom:
        density: 0.3
        items:
          - colorJitter:
              hue: 4
              value: 0.1
            kind: scripted
            params:
              cap: "#7a9a86"
              stem: "#e8f0ea"
            randomRotation: true
            scale:
              - 1
              - 1.8
            script: scripts/mushroom.js
            seed: 1
  generator: scripts/flat-starter-terrain.js
  kind: heightmap
  materials:
    - albedo: cdn/texture-terrain-grass-realistic-albedo-summer-exploration.png
      id: grass
      pbr: true
      tint: oklch(0.60 0.07 145)
    - albedo: cdn/texture-terrain-gravel-realistic-albedo.png
      id: gravel
      pbr: true
      tint: oklch(0.70 0.02 80)
    - albedo: cdn/texture-terrain-rock-realistic-albedo.png
      id: rock
      pbr: true
      tint: oklch(0.58 0.02 260)
  seed: 1
